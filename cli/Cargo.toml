[package]
name = "vladini"
version = "0.2.0"
edition = "2021"
description = "CLI tool for compression, format conversion, and metadata stripping of images, audio, and video files"
license = "GPL-3.0-or-later"

[lib]
name = "vladini"
path = "src/lib.rs"

[[bin]]
name = "vladini"
path = "src/main.rs"

[dependencies]
image = "0.25"
imagequant = "4"
lodepng = "3"
oxipng = "10"
id3 = "1.14"
webp = "0.3"
mp4 = "0.14"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
indicatif = "0.17"
rayon = "1"
